const sprites=[['dec1','a00'],['dec2','a02'],['dec3','a03'],['dec4','a07']];sprites.forEach(([cl,id])=>inner+=`<img class="sprite ${cl}" src="${IMAGES[id]}" alt="Garden decoration"/>`);
inner+=`<img class="sprite plant" src="${IMAGES.tuantuan}" alt="Tuantuan virtual plant"/><img class="sprite pet" src="${IMAGES[u.pet]}" alt="${esc(u.petName)} virtual pet"/>`;
return `<div class="garden-scene ${kind}" ${!['feed','post'].includes(kind)?'':`role="button" tabindex="0" onclick="openPost('${postForUser(uid).id}')" onkeydown="if(event.key==='Enter')openPost('${postForUser(uid).id}')"`} aria-label="Tuantuan and ${esc(u.petName)} in the garden; blue dog shapes are decorations">${inner}</div>`}
function postForUser(uid){return POSTS.find(p=>p.user===uid)||POSTS[0]}
function followButton(uid){return `<button class="mini-follow ${user(uid).following?'following':''}" onclick="toggleFollow('${uid}')">${user(uid).following?'Following':'Follow'}</button>`}
function actions(p){const lk=state.likes.has(p.id), sv=state.saves.has(p.id);return `<div class="actions"><button class="${lk?'liked':''}" onclick="like('${p.id}')">${ic('heart',20)} ${p.likes+(lk?1:0)}</button><button onclick="openPost('${p.id}')">${ic('comment',19)} ${p.comments+state.localComments.filter(x=>x.post===p.id).length}</button><button class="${sv?'saved':''}" onclick="save('${p.id}')">${ic('bookmark',20)} ${p.saves+(sv?1:0)}</button></div>`}
function feedCard(p){const u=user(p.user);return `<article class="feedcard"><div class="author" style="cursor:pointer" onclick="openProfile('${u.id}')">${avatar(u)}<div><div class="name">${esc(u.name)}</div><div class="time">${esc(p.time)}</div></div><button class="more" onclick="event.stopPropagation();notify('Post options: report / hide')">${ic('more',19)}</button></div><div class="caption" role="button" onclick="openPost('${p.id}')">${esc(p.caption)}</div>${scene(u.id,'feed',p.crop)}${actions(p)}</article>`}
function header(){return `<div class="header"><h1 class="title">Social</h1><button class="iconbtn bell-mark" onclick="go('notifications')" aria-label="Notifications">${ic('bell',20)}</button></div>`}
function tabBar(){return `<div class="tabs"><button class="tab ${state.tab==='recommended'?'selected':''}" onclick="state.tab='recommended';go('feed')">Recommended</button><button class="tab ${state.tab==='following'?'selected':''}" onclick="state.tab='following';go('feed')">Following</button></div>`}
function searchBox(){return `<div class="searchbox" onclick="if(state.page!=='search')go('search')">${ic('search',18)}<input type="search" placeholder="Search users, gardens, or posts" id="query" value="${esc(state.query)}" oninput="updateSearch(this.value)" onfocus="if(state.page!=='search')go('search')">${state.query?`<button onclick="event.stopPropagation();state.query='';go('search')">×</button>`:''}</div>`}
function renderFeed(){const subset=state.tab==='following'?POSTS.filter(p=>user(p.user).following):POSTS.slice(0,4);return `${header()}<div class="content">${tabBar()}${searchBox()}${subset.length?subset.map(feedCard).join(''):'<div class="privacy">No posts from followed users yet.</div>'}</div><button class="floating" onclick="go('compose')">${ic('plus',24)}</button>`}
function updateSearch(v){state.query=v;state.page='search';render(false);let i=document.getElementById('query');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
function renderSearch(){let q=state.query.trim().toLowerCase();let ures=PEOPLE.filter(u=>!q||[u.name,u.petName,u.bio].join(' ').toLowerCase().includes(q));let pres=POSTS.filter(p=>!q||[p.caption,user(p.user).name,user(p.user).petName].join(' ').toLowerCase().includes(q));return `${header()}<div class="content">${tabBar()}${searchBox()}<div class="section-head"><h2>Users <span class="minor">(${ures.length})</span></h2></div>${ures.slice(0,3).map(u=>`<div class="resultrow">${avatar(u,43)}<div class="data" onclick="openProfile('${u.id}')"><div class="name">${esc(u.name)}</div><div class="tinyline">${esc(u.bio)}</div></div>${followButton(u.id)}</div>`).join('')||'<p class="note">No users found</p>'}<div class="section-head"><h2>Gardens <span class="minor">(${ures.filter(u=>u.open).length})</span></h2></div>${ures.filter(u=>u.open).slice(0,2).map(u=>`<div class="resultgarden" onclick="openGarden('${u.id}')">${scene(u.id,'search',postForUser(u.id).crop)}<div class="info"><strong>${esc(u.name)}'s Garden</strong><small>Tuantuan · ${esc(u.petName)}</small><small>Public garden · Visit ›</small></div></div>`).join('')||'<p class="note">No public gardens found</p>'}<div class="section-head"><h2>Posts <span class="minor">(${pres.length})</span></h2></div>${pres.slice(0,3).map(p=>`<div class="resultpost" onclick="openPost('${p.id}')">${scene(p.user,'search',p.crop)}<div class="info"><strong>${esc(user(p.user).name)}</strong><div style="margin-top:5px">${esc(p.caption)}</div><div class="small" style="margin-top:6px">♡ ${p.likes}　${ic('comment',12)} ${p.comments}</div></div></div>`).join('')||'<p class="note">No posts found</p>'}</div>`}
function pagebar(name){return `<div class="pagebar"><button class="iconbtn tiny" onclick="go('feed')">${ic('back',19)}</button><div class="pagetitle">${esc(name)}</div></div>`}
function renderPost(){let p=post(state.post),u=user(p.user);let notes=[...COMMENTS,...state.localComments.filter(x=>x.post===p.id)];return `${pagebar('Post')}<div class="content postdetail"><article class="feedcard"><div class="postdetail-author">${avatar(u,44)}<div class="grow" onclick="openProfile('${u.id}')"><div class="name">${esc(u.name)}</div><div class="time">${esc(p.time)}</div></div>${followButton(u.id)}</div><div class="caption">${esc(p.caption)}</div>${scene(u.id,'post',p.crop)}${actions(p)}<button class="button" style="margin-top:11px;width:100%;background:#f4fff0" onclick="openGarden('${u.id}')">Visit ${esc(u.name)}'s Garden →</button></article><section class="comments"><h2>Comments (${notes.length})</h2>${notes.map((c,i)=>{const cu=user(c.user);return `<div class="commentitem">${avatar(cu,36)}<div class="body"><div style="display:flex;gap:6px;align-items:center"><strong style="font-size:12px">${esc(cu.name)}</strong><span class="small">${esc(c.time)}</span></div><div class="text">${esc(c.text)}</div><div class="meta"><button class="reply" onclick="document.getElementById('cm').value='@${esc(cu.name)} ';document.getElementById('cm').focus()">Reply</button>${i>=COMMENTS.length?'<button class="reply" onclick="deleteComment('+i+')">Delete</button>':''}</div></div></div>`}).join('')}<div class="commentinput"><input id="cm" placeholder="Add a comment..." maxlength="220" onkeydown="if(event.key==='Enter')addComment()"><button onclick="addComment()">${ic('send',19)}</button></div></section></div>`}
function addComment(){let t=document.getElementById('cm');if(!t||!t.value.trim())return;state.localComments.push({post:state.post,user:'lily',text:t.value.trim(),time:'now'});render(false);notify('Comment posted')}
function deleteComment(i){let a=i-COMMENTS.length; if(a>=0){let id=state.localComments.filter(x=>x.post===state.post)[a];state.localComments.splice(state.localComments.indexOf(id),1);render(false);notify('Comment deleted')}}
function renderVisit(){const u=user(state.owner),p=postForUser(u.id);return `${pagebar(u.name+'\'s Garden')}<div class="content visit"><div class="ownerbox" onclick="openProfile('${u.id}')">${avatar(u,47)}<div class="grow"><div class="name">${esc(u.name)}</div><div class="small" style="margin-top:4px">${esc(u.bio)}</div></div><div class="tag">${u.open?'◉ Public':'Private'}</div></div>${u.open?`${scene(u.id,'visit')}<div class="infobox"><h3>In This Garden</h3><div class="personline"><img class="avatar" src="${IMAGES.tuantuan}" alt="Tuantuan virtual plant"/><strong style="font-size:13px">Tuantuan</strong><span class="small" style="margin-left:auto">Virtual plant · No level</span></div><div class="personline"><img class="avatar ${u.tint||''}" src="${IMAGES[u.pet]}" alt="${esc(u.petName)}"/><strong style="font-size:13px">${esc(u.petName)}</strong><span class="level">Lv.${u.level}</span><span class="small" style="margin-left:auto">Virtual pet</span></div><div class="note" style="margin-top:7px">The blue puppy, UFOs, flowers, fences and bridges are decorative objects. Decor may appear multiple times.</div></div><div class="visitbuttons"><button onclick="like('${p.id}')">${ic('heart',14)} Like post</button><button onclick="save('${p.id}')">${ic('bookmark',14)} Save post</button><button class="primary" onclick="openPost('${p.id}')">View Post →</button></div>`:`<div class="privacy">${ic('lock',28)}<h3>Private garden</h3><p>Owner has not enabled garden visits.</p></div>`}</div>`}
function renderProfile(){const u=user(state.owner);return `${pagebar('Profile')}<div class="content"><div class="profileHero">${avatar(u,72)}<h2>${esc(u.name)}</h2><p>${esc(u.bio)}</p><div class="profilebuttons">${followButton(u.id)}<button class="secondary" onclick="openGarden('${u.id}')">${u.open?'Visit Garden':'Private Garden'}</button></div></div><div class="infobox"><div class="personline"><img class="avatar" src="${IMAGES.tuantuan}" alt="Tuantuan virtual plant"/><div style="flex:1"><strong>Tuantuan</strong><div class="small">Virtual plant · no level</div></div></div><div class="personline"><img class="avatar" src="${IMAGES[u.pet]}"><div style="flex:1"><strong>${esc(u.petName)}</strong><div class="small">Virtual pet · Lv.${u.level}</div></div></div></div><div class="section-head"><h2>Posts</h2></div>${POSTS.filter(p=>p.user===u.id).map(feedCard).join('')}</div>`}
function renderCompose(){return `${pagebar('Create Post')}<div class="content"><div class="composebox"><div class="note">Use a snapshot generated from your own garden or pet history. You choose when to publish.</div><label class="formlabel">Select a screenshot</label><div class="selectgrid">${[POSTS[0],POSTS[1]].map(p=>`<div class="selectitem ${state.selectedPost===p.id?'selected':''}" onclick="state.selectedPost='${p.id}';render(false)">${scene('lily','search',p.crop)}<label>${p.id==='p1'?'Garden snapshot':'Exploration memory'}</label></div>`).join('')}</div><label class="formlabel">Caption</label><textarea class="textarea" id="draft" placeholder="Share a moment from your garden..." oninput="state.draft=this.value">${esc(state.draft)}</textarea><p class="note">First version: image + text only. No automatic AI publishing or free-form image upload.</p><button class="button" onclick="publishPreview()" style="width:100%;margin-top:4px">Publish preview</button></div></div>`}

function renderNotifications(){const items=[['moss','MossyBean liked your garden post.','12 min ago'],['sunny','SunnySprout followed you.','1 h ago'],['fern','FernDays commented on your photo.','3 h ago']];return `${pagebar('Notifications')}<div class="content"><div class="section-head"><h2>Activity</h2><button class="textlink" onclick="state.noticeRead=true;render(false)">Mark all read</button></div>${items.map(([id,t,time])=>`<div class="messageitem" onclick="openProfile('${id}')">${avatar(user(id),39)}<div class="text"><strong>${esc(user(id).name)}</strong> · ${esc(t)}<div class="small" style="margin-top:4px">${time}</div></div>${state.noticeRead?'':'<div class="msgdot"></div>'}</div>`).join('')}</div>`}
function renderGardenStub(){return `${pagebar('Garden')}<div class="content"><div class="note" style="margin-bottom:9px">This social prototype shows the established garden map and the two-role rule.</div>${scene('lily','home')}<button class="button" style="width:100%;margin-top:11px" onclick="go('feed')">Back to Social</button></div>`}
function renderMeStub(){return `${pagebar('Me')}<div class="content"><div class="profileHero">${avatar(user('lily'),70)}<h2>My Garden</h2><p>Manage plants, your one pet and sharing settings in the Me module.</p><button class="button" onclick="go('feed')">Back to Social</button></div><div class="infobox"><div class="personline"><strong>Garden visits</strong><span style="margin-left:auto;font-size:12px">Private by default</span></div></div></div>`}
function render(transition=false){const scroll=elem.scrollTop;elem.innerHTML=({feed:renderFeed,search:renderSearch,post:renderPost,visit:renderVisit,profile:renderProfile,compose:renderCompose,notifications:renderNotifications,garden:renderGardenStub,me:renderMeStub}[state.page]||renderFeed)();document.getElementById('bottomnav').innerHTML=[['garden','Garden'],['feed','Social'],['me','Me']].map(([page,label])=>`<button class="navitem ${((state.page==='garden'&&page==='garden')||(state.page==='me'&&page==='me')||(!['garden','me'].includes(state.page)&&page==='feed'))?'active':''}" onclick="go('${page}')">${label}</button>`).join('');if(!transition)elem.scrollTop=scroll;else elem.scrollTop=0}
window.setPreviewPage=(name)=>{if(name==='following'){state.tab='following';go('feed');return}if(name==='recommended'){state.tab='recommended';go('feed');return}if(name==='search'){state.tab='recommended';state.query='Eggie';go('search');return}if(name==='post'){state.post='p1';go('post');return}if(name==='visit'){state.owner='lily';go('visit');return}if(name==='profile'){state.owner='lily';go('profile');return}if(name==='compose'){go('compose');return}if(name==='notifications'){go('notifications');return}go('feed')};

/* Integrated Social adapter. Garden V12 stays untouched and supplies the authoritative state. */
(function(){
  'use strict';
  const originalSave=save, originalFollow=toggleFollow;
  const localUser=PEOPLE.find(x=>x.id==='lily');
  let syncSignature=''; let activeMap='';
  function sendSocial(){try{window.parent.PlantMateHub.updateSocial({saves:[...state.saves],likes:[...state.likes],following:PEOPLE.filter(x=>x.following).map(x=>x.id)});}catch(_){}}
  save=function(id){originalSave(id);sendSocial();};
  toggleFollow=function(id){originalFollow(id);sendSocial();};
  // Reuse V12 layered map; remove overlay decorations because the layer-export already includes them.
  // Each scene still renders exactly ONE Tuantuan and ONE virtual pet.
  scene=function(uid,kind='feed',crop=61){
    const u=user(uid);
    const sceneHeight=kind==='visit'?660:kind==='post'?290:kind==='home'?540:kind==='search'?112:182;
    const mapCrop=kind==='visit'||kind==='home'?0:kind==='post'?-154:kind==='search'?-95:-115;
    let inner=`<img class="map-img" src="${IMAGES.map}" style="top:${mapCrop}px" alt="Garden V12 layered-map rendering"/>`;
    inner+=`<img class="sprite plant" src="${IMAGES.tuantuan}" alt="Tuantuan · autonomous virtual plant"/><img class="sprite pet" src="${IMAGES[u.pet]}" alt="${esc(u.petName)} · one virtual pet"/>`;
    const clickable=['feed','post'].includes(kind);
    return `<div class="garden-scene ${kind}" ${clickable?`role="button" tabindex="0" onclick="openPost('${postForUser(uid).id}')" onkeydown="if(event.key==='Enter')openPost('${postForUser(uid).id}')"`:''} aria-label="Garden V12 environment with one Tuantuan, one ${esc(u.petName)}; blue puppy is decorative">${inner}</div>`;
  };
  // Site V12 is authoritative for the owner's garden, XP and current level.
  window.PlantMateSocialSync=function(data){
    if(!data)return;
    IMAGES.tuantuan=data.tuantuan||IMAGES.tuantuan;
    IMAGES.egg=data.eggie||IMAGES.egg;
    if(data.map){IMAGES.map=data.map;activeMap=data.map;}
    localUser.name=data.owner;
    localUser.pet='egg';localUser.avatar='egg';localUser.petName=data.petName||'Eggie';
    localUser.level=data.level;localUser.bio=data.bio||'Tuantuan and Eggie · Plant Mate';
    localUser.open=data.visitMode!=='closed';
    // This key excludes countdown and map-image changes; avoid disturbing search/caption input focus.
    const key=[data.owner,data.petName,data.level,data.visitMode].join('|');
    if(syncSignature!==key){syncSignature=key;render(false);}
    else if(data.map){document.querySelectorAll('.garden-scene .map-img').forEach(el=>{if(el.src!==activeMap)el.src=activeMap;});}
  };
  window.PlantMateSocialOpen=function(opts={}){
    if(opts.page==='post'){openPost(opts.post||'p1');return;}
    if(opts.page==='visit'){openGarden(opts.owner||'lily');return;}
    if(opts.page==='notifications'){go('notifications');return;}
    if(opts.page==='saved'){go('feed');return;}
    if(opts.page==='following'){state.tab='following';go('feed');return;}
    if(opts.page==='recommended'){state.tab='recommended';go('feed');return;}
    if(opts.page==='search'){go('search');return;}
    go('feed');
  };
  // Current user's public garden uses one owner; demo visitors are presentation users with the same V12 map system.
  // Leave the approved V4 comments, saved posts, recommendations, searching, and notifications UI intact.
  try{sendSocial();}catch(_){ }
})();

</script>
