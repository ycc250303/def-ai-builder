</head><body><main class="phone" id="app"><div class="statusbar"><span>9:41</span><span class="statusicons">▂▅▇ ◉ ▰</span></div><div id="screen" class="screen"></div><nav class="bottomnav" id="bottomnav"></nav><div id="toast" role="status"></div></main>
<script>
const IMAGES=window.parent.PlantMateHubAssets.me;
const PETS=['egg','pet08','pet01','pet02','pet03','pet04','pet05','pet06','pet07']; // 1 initial, 1 fixed Lv5, 7 Lv10 outcomes
const JOURNAL=[
 {type:'Explore',title:'A mushroom found its way home',date:'Today · 14:32',detail:'Tuantuan returned from exploring with a new decoration.'},
 {type:'Clean',title:'A fresh start',date:'Today · 11:05',detail:'Tuantuan gently cleaned Eggie. Clean +20 · Growth XP +4.'},
 {type:'Feed',title:'A little lunchtime treat',date:'Today · 09:14',detail:'Tuantuan prepared a little meal. Food +20 · Mood +3 · Growth XP +4.'},
 {type:'Sleep',title:'Time to rest',date:'Yesterday · 22:18',detail:'Eggie slept while Tuantuan kept watch. Energy gradually restored.'},
 {type:'Play',title:'A tiny game',date:'Yesterday · 16:40',detail:'A playful moment in the garden. Mood +12 · Energy -8.'},
 {type:'Growth',title:'Eggie reached Level 2',date:'Nov 20 · 13:20',detail:'A new level! The shape will evolve at a later milestone.'}
];
const state={page:'me',stack:[],username:'LilyGarden',bio:'A little green world, one day at a time 🌱',accountId:'@lilygarden',avatar:'egg',finalForm:null,plantName:'Tuantuan',petName:'Eggie',level:2,visitMode:'public',alerts:true,diaryFilter:'All',selectedEvo:'egg',profileEdit:'',tip:'',viewTab:'Me'};
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function icon(n,size=20){let p={back:'<path d="M19 12H5m7 7-7-7 7-7"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M4.9 19.1 7 17m10-10 2.1-2.1"/>',right:'<path d="m9 18 6-6-6-6"/>',edit:'<path d="m4 20 5-1 11-11-4-4L5 15l-1 5Z"/>',heart:'<path d="M20.8 4.5a5.4 5.4 0 0 0-7.6 0L12 5.7l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6l8.8 8.8 8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/>',star:'<path d="m12 2 2.9 6 6.6 1-4.8 4.7 1.1 6.6L12 17.2l-5.8 3.1 1.1-6.6L2.5 9l6.6-1Z"/>',leaf:'<path d="M20 4c-9 0-14 3-14 11 0 3 2 5 4 5 8 0 11-6 10-16ZM6 20c3-6 6-8 11-11"/>',flower:'<circle cx="12" cy="12" r="2"/><circle cx="12" cy="5" r="3"/><circle cx="19" cy="12" r="3"/><circle cx="12" cy="19" r="3"/><circle cx="5" cy="12" r="3"/>',book:'<path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M7 2v6M17 2v6M3 11h18"/>',device:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 17h6M9 7h6"/>',shield:'<path d="M12 2 4 5v7c0 5 3 8 8 10 5-2 8-5 8-10V5Z"/><path d="m8 12 3 3 5-6"/>',bookmark:'<path d="M6 3h12v18l-6-4-6 4V3Z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/>',chevron:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m4 12 5 5L20 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-4 1 2-5Z"/>',moon:'<path d="M20 15A8 8 0 0 1 9 4 8 8 0 1 0 20 15Z"/>',sparkles:'<path d="m12 2 2 7 7 2-7 2-2 7-2-7-7-2 7-2Zm8 14 1 2 2 1-2 1-1 2-1-2-2-1 2-1Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',help:'<circle cx="12" cy="12" r="10"/><path d="M9 9a3 3 0 1 1 4 3l-1 2m0 3v1"/>',unlock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" style="flex-shrink:0;vertical-align:middle">${p[n]||p.info}</svg>`}
function toast(m){$('#toast').innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(window.__not);window.__not=setTimeout(()=>$('#toast').innerHTML='',1800)}
function go(page){if(['garden','gardenFull'].includes(page)){toast('Garden interface will be designed separately.');return;}if(['decorations','achievements'].includes(page))page='me';if(state.page!==page)state.stack.push(state.page);state.page=page;render(true)}
function back(){state.page=state.stack.pop()||'me';render(true)}
function header(title,right=''){return `<div class="subbar"><button class="iconbtn tiny" onclick="back()" aria-label="Go back">${icon('back',20)}</button><h1 class="pagetitle" style="flex:1">${title}</h1>${right}</div>`}
function section(t,right=''){return `<div class="me-title"><strong>${t}</strong>${right?`<span class="hint">${right}</span>`:''}</div>`}
function tile(name,sub,ico,page,cl=''){return `<button class="coll-card" onclick="go('${page}')"><span class="tile-icon ${cl}">${icon(ico,23)}</span><span class="txt"><strong>${name}</strong><small>${sub}</small></span></button>`}
function line(name,ico,page,right=''){return `<button class="menu-row" onclick="go('${page}')"><span class="mini-icon">${icon(ico,19)}</span><strong>${name}</strong>${right?`<span class="right-hint">${right}</span>`:''}${icon('chevron',17)}</button>`}
function pict(stage='main'){return `<div class="pic-ribbon"><img class="map-img" src="${IMAGES.map}" alt="Original approved garden map"><img class="character ch1" src="${IMAGES.tuantuan}" alt="Tuantuan"><img class="character ch2" src="${IMAGES.egg}" alt="Eggie"></div>`}
function meter(label,n,cls=''){return `<div><div class="meter-head"><strong>${label}</strong><span>${n}/100</span></div><div class="meter ${cls}"><span style="width:${n}%"></span></div></div>`}
function main(){return `<div class="meheading"><h1 class="title">Me</h1><button class="iconbtn" onclick="go('settings')" aria-label="Settings">${icon('gear',20)}</button></div><div class="pagewrap"><div class="pro-card" onclick="go('profile')"><img src="${IMAGES[state.avatar]}" class="avatar" alt="Chosen avatar"><div class="pro-copy"><strong>${esc(state.username)}</strong><div class="bio">${esc(state.bio)}</div><span class="inline-tag">21 days growing together</span></div>${icon('right',20)}</div>${section('My companions','One plant · one pet')}<div class="role-grid"><button class="role-card" onclick="go('plant')"><div class="roleart"><img src="${IMAGES.tuantuan}" alt="Tuantuan original image"></div><strong>My Plant</strong><div class="sub">${esc(state.plantName)} · Pothos</div></button><button class="role-card" onclick="go('pet')"><div class="roleart petbg"><img src="${IMAGES.egg}" alt="Approved current pet"></div><strong>My Pet <span class="pill-level">Lv.${state.level}</span></strong><div class="sub">${esc(state.petName)} · Growing</div></button></div>${section('My growth')}<div class="coll-grid">${tile('Evolution History','Only forms actually experienced','sparkles','evolution')}${tile('Growth Diary','Actions and level history','book','diary','lav')}</div>${section('My space')}<div class="menu-box">${line('Saved posts','bookmark','saved','2 posts')}${line('My device','device','device','Mosaico')}${line('Garden visiting permissions','shield','privacy')}${line('Edit profile','edit','profile')}${line('Settings','gear','settings')}</div></div>`}
function plant(){return `${header('My Plant')}<div class="pagewrap"><div class="art-hero"><small>VIRTUAL PLANT</small><img src="${IMAGES.tuantuan}" alt="Tuantuan final unmodified sprite"></div><div class="name-row"><div><h2>${esc(state.plantName)}</h2><p>Linked real plant: Pothos · 21 days together</p></div><button class="ghostbtn" onclick="rename('plant')">Rename</button></div><div class="soft-note">Tuantuan is the autonomous caregiver, not a level-based character. Sensor data influences its decisions; the AI chooses only from valid behaviors.</div>${section('Environment','Sample readings')}<div class="sensor-grid"><div class="sensor"><div class="senshead">☼ Light</div><div class="value">720 <span class="unit">lux</span></div><div class="good">In range</div></div><div class="sensor"><div class="senshead">◉ Soil moisture</div><div class="value">42 <span class="unit">%</span></div><div class="good">In range</div></div><div class="sensor"><div class="senshead">♧ Temperature</div><div class="value">24.6 <span class="unit">°C</span></div><div class="good">In range</div></div><div class="sensor"><div class="senshead">◌ Air humidity</div><div class="value">61 <span class="unit">%RH</span></div><div class="good">In range</div></div></div>${section('Environment trend','Demo · today')}<div class="info-card"><svg class="tiny-chart" viewBox="0 0 310 86"><path d="M4 18H306M4 46H306M4 74H306" stroke="#e6ebe6" stroke-width="1"/><polyline points="8,71 38,64 64,52 96,47 126,29 157,21 191,36 220,47 254,58 301,66" stroke="#659d70" stroke-width="2.5" fill="none"/></svg><div class="small" style="display:flex;justify-content:space-between"><span>07:00</span><span>12:00</span><span>18:00</span></div></div><button class="solidbtn" style="margin-top:11px;width:100%" onclick="go('device')">View device information</button></div>`}
function pet(){return `${header('My Pet',`<button class="iconbtn tiny" onclick="rename('pet')" aria-label="Rename pet">${icon('edit',17)}</button>`)}<div class="pagewrap"><div class="art-hero pet-hero"><small>ONE PET · THREE GROWTH STAGES</small><img src="${IMAGES.egg}" alt="Final approved initial egg form"></div><div class="name-row"><div><h2>${esc(state.petName)} <span class="pill-level">Lv.${state.level}</span></h2><p>Initial form · Pet, not an egg to hatch</p></div><button class="ghostbtn" onclick="rename('pet')">Rename</button></div>${section('Current needs')}<div class="info-card"><div class="meter-list">${meter('Food',77)}${meter('Mood',91,'pink')}${meter('Energy',63,'gold')}${meter('Clean',68,'blue')}</div><div style="border-top:1px dashed #cfd3ce;margin:13px 0 10px"></div><div class="hintbar"><strong>Growth XP</strong><span style="font-weight:500;color:#777">43 / 50</span></div><div class="meter long pink"><span style="width:86%"></span></div></div><div class="info-card"><strong style="font-size:13px">Evolution milestones</strong><p class="small">Lv.5 → fixed second egg-like form · Lv.10 → one of 7 final forms (saved once). Level continues after the final evolution. Ordinary leveling updates numbers and diary only.</p></div><div class="medley"><button onclick="go('evolution')"><strong>Evolution History →</strong><small>Only your pet's experienced forms</small></button><button onclick="go('diary')"><strong>Growth Diary →</strong><small>Action and level-up records</small></button></div></div>`}
function evolution(){let path=[['egg','Initial form','Lv.1 · Already experienced']];if(state.level>=5)path.push(['pet08','Second form','Lv.5 · Fixed evolution']);if(state.level>=10){if(!state.finalForm)state.finalForm=['pet01','pet02','pet03','pet04','pet05','pet06','pet07'][Math.floor(Math.random()*7)];path.push([state.finalForm,'Mature form','Lv.10 · A random final form (prototype session)']);}return `${header('Evolution History')}<div class="pagewrap"><div class="soft-note">This is the history of ONE pet, not a collection of multiple pets. Only experienced shapes appear; no unexplored branches or special form names.</div><div class="info-card" style="display:flex;align-items:center;gap:12px"><img src="${IMAGES[path[path.length-1][0]]}" style="width:84px;height:84px;object-fit:contain;image-rendering:pixelated" alt="Pet current form"><div><span class="badge-inline">CURRENT FORM</span><h2 style="font-size:16px;margin:6px 0">${esc(state.petName)} · Lv.${state.level}</h2><div class="small">${path.length} experienced form${path.length!==1?'s':''}</div></div></div>${section('My evolution path')}<div class="timeline">${path.map(([id,title,desc],i)=>`<div class="event" style="display:flex;align-items:center;gap:12px"><img src="${IMAGES[id]}" style="height:78px;width:78px;object-fit:contain;image-rendering:pixelated" alt="Experienced pet form"><div><h3>${title}</h3><p>${desc}</p>${i===path.length-1?'<span class="badge-inline">CURRENT</span>':''}</div></div>`).join('')}</div><div class="soft-note">Next: ${state.level<5?'Lv.5 fixed evolution':state.level<10?'Lv.10 random mature evolution':'Final appearance reached; levels continue'}. Forms cannot be chosen or rerolled.</div></div>`}
function chooseEvo(id){state.selectedEvo=id;if(id==='egg')toast('This is Eggie’s current form');else toast('Undiscovered form · no name or manual unlock')}
function diary(){let ev=JOURNAL.filter(x=>state.diaryFilter==='All'||(state.diaryFilter==='Care'&&x.type!=='Explore'&&x.type!=='Growth')||(state.diaryFilter==='Explore'&&x.type==='Explore')||(state.diaryFilter==='Growth'&&x.type==='Growth'));return `${header('Growth Diary')}<div class="pagewrap"><div class="soft-note">Events are recorded automatically from Tuantuan’s actions and Eggie’s growth. There is no manual action control in this diary.</div><div class="tabsmini">${['All','Care','Explore','Growth'].map(x=>`<button class="${state.diaryFilter===x?'selected':''}" onclick="state.diaryFilter='${x}';render(false)">${x}</button>`).join('')}</div><div class="timeline">${ev.map(x=>`<div class="event"><time>${x.date} · ${x.type}</time><h3>${x.title}</h3><p>${x.detail}</p></div>`).join('')||'<div class="blank-card">No events in this category yet.</div>'}</div></div>`}
function saved(){return `${header('Saved Posts')}<div class="pagewrap"><div class="soft-note">Saved items from the social feed. Public posts and garden visiting permissions are separate.</div>${[{who:'MossyBean',caption:'New bridge and pond! What do you think? 💧',when:'5 h ago',likes:278},{who:'SunnySprout',caption:'A calm day in my little garden ✨',when:'12 h ago',likes:416}].map(x=>`<div class="compact-feed"><div class="pic-ribbon"><img class="map-img" src="${IMAGES.map}" alt="Original garden map"><img class="character ch1" src="${IMAGES.tuantuan}" alt="Tuantuan"><img class="character ch2" src="${IMAGES.pet01}" alt="Approved pet"></div><div><strong>${x.who}</strong><div class="small">${x.when}</div><p>${x.caption}</p><div class="counts">♡ ${x.likes} · Saved</div></div></div>`).join('')}</div>`}
function device(){return `${header('My Device')}<div class="pagewrap"><div class="info-card" style="display:flex;align-items:center;gap:12px"><span class="tile-icon">${icon('device',29)}</span><div><strong style="font-size:16px">Mosaico</strong><p class="small">Connected · Plant Mate desktop companion</p><span class="badge-inline">Demo status</span></div></div>${section('Linked plant')}<div class="info-card" style="display:flex;align-items:center;gap:12px"><img src="${IMAGES.tuantuan}" style="width:73px;height:73px;object-fit:contain;image-rendering:pixelated" alt="Tuantuan"><div><strong>${esc(state.plantName)} · Pothos</strong><p class="small">Sensor module: Light / Soil / Temperature / Humidity</p></div></div>${section('Connection information')}<div class="info-card"><div class="settings-item"><div class="copy"><strong>Device name</strong><p>Plant Mate Mosaico</p></div></div><div class="settings-item"><div class="copy"><strong>Last sample</strong><p>Just now · Simulation</p></div></div><div class="settings-item"><div class="copy"><strong>Sensor values</strong><p>Read-only in app; cannot be edited</p></div><button class="ghostbtn" onclick="go('plant')">View</button></div></div><div class="soft-note">Device management is separate from the Garden home screen. Values shown here are illustrative; no physical hardware is connected to this HTML demo.</div></div>`}
function privacy(){const options=[['public','Completely open','Anyone may visit directly.'],['request','Request approval','Visitors apply; owner approves or denies before entering.'],['closed','Closed','Nobody else may visit.'],['following','Following','People I follow may visit directly.'],['mutual','Mutual follows','Only accounts we follow each other may visit directly.'],['followers','Followers','Accounts following me may visit directly.']];return `${header('Privacy & Visits')}<div class="pagewrap"><div class="info-card"><h2 style="font-size:18px;margin:0 0 6px">Garden visiting permissions</h2><p class="small">One overall access rule; profile, garden image and device sensor records are not separate toggles.</p>${options.map(([key,title,desc])=>`<label class="privacy-choice"><input type="radio" name="visiting" value="${key}" ${state.visitMode===key?'checked':''} onchange="state.visitMode=this.value;render(false)"><span><strong>${title}</strong><small>${desc}</small></span></label>`).join('')}<div class="soft-note" style="margin-bottom:0">Chosen: ${options.find(x=>x[0]===state.visitMode)[1]}. ${state.visitMode==='request'?'Visiting requires owner approval in a real multi-user version.':'Anyone matching this rule enters directly, without an approval request.'}</div></div><div class="info-card"><strong>Visitor-visible information</strong><p class="small">Authorized visitors see the garden scene, Tuantuan and the pet's appearance and name. Raw sensor readings, unshared growth diaries and device data stay private.</p></div><div class="soft-note">Demo note: These six controls update this offline UI only. Enforcing request approval, follower lists and authentication requires a backend. Public posts remain independent of garden-access settings.</div></div>`}
function settings(){return `${header('Settings')}<div class="pagewrap"><div class="menu-box">${line('Edit profile','edit','profile')}${line('Privacy & visiting','shield','privacy')}${line('My device','device','device')}${line('Saved posts','bookmark','saved')}</div>${section('Notifications')}<div class="info-card"><div class="settings-item"><div class="copy"><strong>Likes, comments and follows</strong><p>Show social notifications</p></div><button role="switch" aria-checked="${state.alerts}" class="switch ${state.alerts?'':'off'}" onclick="state.alerts=!state.alerts;render(false)"></button></div></div><div class="soft-note">Illustrative settings only. Nothing is uploaded, synced, or shared from this offline prototype.</div></div>`}
function profile(){return `${header('Edit Profile')}<div class="pagewrap"><div class="info-card"><div style="display:flex;gap:10px;align-items:center"><img class="avatar pink" style="width:72px;height:72px" src="${IMAGES[state.avatar]}" alt="Current selected avatar"><div><strong>Profile avatar</strong><p class="small">Choose your current pet or Tuantuan as an avatar (not an evolution choice)</p></div></div><div class="avatar-options">${['egg','tuantuan'].map(key=>`<button class="avatar-pick ${state.avatar===key?'chosen':''}" onclick="chooseAvatar('${key}',this)" title="Select avatar"><img src="${IMAGES[key]}" alt="Original pet sprite avatar"></button>`).join('')}</div></div><label class="formlabel" for="userNameInput">Nickname</label><input class="field" id="userNameInput" value="${esc(state.username)}" maxlength="24"/><label class="formlabel" for="bioInput">About me</label><textarea class="field" id="bioInput" rows="4" maxlength="150">${esc(state.bio)}</textarea><label class="formlabel">Account ID (fixed)</label><input class="field" value="${state.accountId}" disabled/><button class="solidbtn" style="width:100%;margin-top:16px" onclick="saveProfile()">Save changes</button><div class="soft-note">This edits the user profile only; it does not change the pet or its evolution branch.</div></div>`}
function chooseAvatar(key,el){state.avatar=key;document.querySelectorAll('.avatar-pick').forEach(x=>x.classList.remove('chosen'));el.classList.add('chosen');document.querySelector('.info-card .avatar').src=IMAGES[key]}
function saveProfile(){let n=$('#userNameInput').value.trim(),b=$('#bioInput').value.trim();if(!n){toast('Please enter a nickname');return}state.username=n;state.bio=b;toast('Demo profile updated');back()}
function rename(which){const current=which==='pet'?state.petName:state.plantName;let v=prompt(which==='pet'?'Rename your virtual pet':'Rename Tuantuan',current);if(v===null)return;v=v.trim();if(!v){toast('Name cannot be empty');return}if(which==='pet')state.petName=v.substring(0,20);else state.plantName=v.substring(0,20);render(false)}
function social(){return `${header('Social')}<div class="pagewrap"><div class="soft-note">Social module V4 is already approved; this is a small linked preview to preserve the Me page’s bottom navigation.</div>${pict()}<div class="info-card"><strong>See the Social V4 delivery for the complete feed</strong><p class="small">Recommended, Following, Search, Post, Garden Visits, Comments and Notifications.</p></div><button class="solidbtn" style="margin-top:11px;width:100%" onclick="go('me')">Back to Me</button></div>`}
function render(reset=false){let page=state.page;$('#screen').innerHTML=({me:main,plant,pet,evolution,diary,saved,device,privacy,settings,profile,social}[page]||main)();let at=page==='garden'||page==='gardenFull'?'garden':page==='social'?'social':'me';$('#bottomnav').innerHTML=[['garden','Garden'],['social','Social'],['me','Me']].map(([target,label])=>`<button class="navitem ${at===target?'active':''}" onclick="go('${target}')">${label}</button>`).join('');if(reset)$('#screen').scrollTop=0}
window.setPreviewPage=(key)=>{if(['decorations','achievements','garden','gardenFull'].includes(key))key='me';state.page=key;state.stack=['me'];if(key==='diary')state.diaryFilter='All';render(true)};
render(true);window.__previewReady=true;
</script><script>
/* Integrated Me adapter. Live values and log come solely from Garden V12, not fake static Me samples. */
(function(){
 'use strict';
 const previousSaveProfile=saveProfile;
 let lastSignature='';let stats={food:45,mood:50,energy:73,clean:65,level:1,xp:12,behavior:'FEED',event:''};
 let currentJournal=[]; let remoteSaved=[];
 const behaviorDetails={FEED:'Feeding · Food +20 · Mood +3 · XP +4',CLEAN:'Cleaning · Clean +25 · Mood +5 · XP +4',PLAY:'Playing · Mood +12 · Energy -8 · Clean -4 · XP +4',EXPLORE:'Exploring · XP +4 · possible mushroom decoration',REST:'Resting · Energy +18 · Mood +4 · XP +4'};
 const oldMain=main;
 main=function(){return oldMain().replace('21 days growing together','Garden V12 · live demo').replace('2 posts',`${remoteSaved.length} saved`);};
 plant=function(){return `${header('My Plant')}<div class="pagewrap"><div class="art-hero"><small>VIRTUAL PLANT · NO LEVEL</small><img src="${IMAGES.tuantuan}" alt="Tuantuan from original Garden V12 PNG"></div><div class="name-row"><div><h2>Tuantuan</h2><p>Linked real plant: Pothos · demo connection</p></div></div><div class="soft-note">Five autonomous behaviors run in Garden V12. Each lasts 15 seconds in this demo; they are not manually triggered here.</div>${section('Current behavior','Synchronized with Garden')}<div class="info-card"><strong>${esc(({FEED:'Feeding',CLEAN:'Cleaning',PLAY:'Playing',EXPLORE:'Exploring',REST:'Resting'})[stats.behavior]||stats.behavior)}</strong><p class="small">${esc(behaviorDetails[stats.behavior]||'Autonomous')}</p><p class="small">Latest garden event: ${esc(stats.event||'Waiting for the first event')}</p></div>${section('Real plant sensors','Not provided by V12')}<div class="soft-note">The supplied Garden V12 is a simulated demonstration and does not publish measured lux, soil moisture, temperature or humidity values. No sensor numbers are invented here.</div><button class="solidbtn" style="width:100%;margin-top:10px" onclick="go('device')">View demo device information</button></div>`;};
 pet=function(){return `${header('My Pet')}<div class="pagewrap"><div class="art-hero pet-hero"><small>ONE VIRTUAL PET · GARDEN V12</small><img src="${IMAGES.egg}" alt="Eggie · exact Garden V12 sprite"></div><div class="name-row"><div><h2>Eggie <span class="pill-level">Lv.${stats.level}</span></h2><p>One pet · No hatching step</p></div></div>${section('Current needs','Live from Garden')}<div class="info-card"><div class="meter-list">${meter('Food',stats.food)}${meter('Mood',stats.mood,'pink')}${meter('Energy',stats.energy,'gold')}${meter('Clean',stats.clean,'blue')}</div><div style="border-top:1px dashed #cfd3ce;margin:13px 0 10px"></div><div class="hintbar"><strong>Growth XP</strong><span style="font-weight:500;color:#777">${stats.xp} / 100</span></div><div class="meter long pink"><span style="width:${stats.xp}%"></span></div></div><div class="soft-note">Values, XP increments and leveling exactly follow the running V12 garden. This page does not independently calculate rewards or assign a second level.</div><div class="medley"><button onclick="go('evolution')"><strong>Evolution Book →</strong><small>Read the Garden V12 unlock state</small></button><button onclick="go('diary')"><strong>Growth Diary →</strong><small>Completed V12 actions</small></button></div></div>`;};
 evolution=function(){return `${header('Evolution Book')}<div class="pagewrap"><div class="soft-note">Garden V12 displays “2 / 9 unlocked”: Baybi and Eggie. The other seven slots remain silhouettes. The supplied V12 does not perform the previously proposed Lv.5 / Lv.10 shape changes; this page does not pretend they have occurred.</div><div class="info-card" style="display:flex;align-items:center;gap:12px"><img src="${IMAGES.egg}" style="width:85px;height:85px;image-rendering:pixelated;object-fit:contain" alt="Eggie"><div><span class="badge-inline">CURRENT IN GARDEN</span><h2 style="font-size:16px;margin:6px 0">Eggie · Lv.${stats.level}</h2><div class="small">Growth XP ${stats.xp} / 100</div></div></div>${section('Unlocked forms','2 / 9')}<div class="sprite-grid"><div class="sprite-tile"><img src="${IMAGES.baybi||IMAGES.pet08}" alt="Baybi"/><span>Baybi ✓</span></div><div class="sprite-tile current"><img src="${IMAGES.egg}" alt="Eggie"/><span>Eggie ✓</span></div>${Array.from({length:7},(_,i)=>`<div class="sprite-tile locked"><img src="${IMAGES['pet0'+(i+1)]||IMAGES.pet01}" alt="Locked silhouette"/><span>???</span></div>`).join('')}</div></div>`;};
 diary=function(){const ev=currentJournal.filter(x=>state.diaryFilter==='All'||(state.diaryFilter==='Care'&&!['Explore','Growth'].includes(x.type))||(state.diaryFilter==='Explore'&&x.type==='Explore')||(state.diaryFilter==='Growth'&&x.type==='Growth'));return `${header('Growth Diary')}<div class="pagewrap"><div class="soft-note">Only events actually completed in the running Garden V12 session appear here. Plant actions are not manually controlled.</div><div class="tabsmini">${['All','Care','Explore','Growth'].map(x=>`<button class="${state.diaryFilter===x?'selected':''}" onclick="state.diaryFilter='${x}';render(false)">${x}</button>`).join('')}</div><div class="timeline">${ev.map(x=>`<div class="event"><time>${esc(x.date)} · ${esc(x.type)}</time><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p></div>`).join('')||'<div class="blank-card">No completed actions in this category yet. Return to Garden and let the V12 demo run.</div>'}</div></div>`;};
 saved=function(){let a=remoteSaved;return `${header('Saved Posts')}<div class="pagewrap"><div class="soft-note">Saved posts are synchronized with Social. Posts are stored only for this local browser demo.</div>${a.length?a.map(id=>`<button class="menu-row" onclick="window.parent.PlantMateHub.show('social',{page:'post',post:'${esc(id)}'})"><span class="mini-icon">${icon('bookmark',19)}</span><strong>${esc(id)} · View saved post</strong>${icon('right',17)}</button>`).join(''):'<div class="blank-card">No saved posts yet. Save a post from the Social tab.</div>'}</div>`;};
 device=function(){return `${header('My Device')}<div class="pagewrap"><div class="info-card" style="display:flex;align-items:center;gap:12px"><span class="tile-icon">${icon('device',29)}</span><div><strong style="font-size:16px">Mosaico · Demo</strong><p class="small">Garden V12 simulated connection</p><span class="badge-inline">Demo connection</span></div></div><div class="soft-note">The V12 garden shows Connected and runs a simulation. This HTML does not read physical sensor measurements; showing invented lux, moisture, temperature or humidity values would misrepresent it.</div>${section('Live garden status')}<div class="info-card"><div class="personline"><strong>Plant</strong><span class="small" style="margin-left:auto">Tuantuan · no level</span></div><div class="personline"><strong>Pet</strong><span class="small" style="margin-left:auto">Eggie · Lv.${stats.level}</span></div><div class="personline"><strong>Behavior</strong><span class="small" style="margin-left:auto">${esc(stats.behavior)}</span></div></div></div>`;};
 // Do not invent a working pet rename: Garden V12 always calls it Eggie.
 rename=function(which){toast(which==='pet'?'V12 Garden fixes the on-screen name Eggie; rename is not available without changing Page 1.':'Tuantuan is fixed in Garden V12. Rename the garden owner from Edit Profile instead.');};
 saveProfile=function(){const name=$('#userNameInput')?.value.trim();previousSaveProfile();if(name){try{window.parent.PlantMateHub.renameOwner(name);}catch(_){}}};
 const oldGo=go;
 go=function(page){if(page==='garden'||page==='gardenFull'){try{window.parent.PlantMateHub.show('garden');}catch(_){toast('Open the Garden tab')}return;}if(page==='social'){try{window.parent.PlantMateHub.show('social');}catch(_){toast('Open the Social tab')}return;}oldGo(page);};
 window.PlantMateMeSync=function(data){if(!data)return;
   stats={...stats,food:data.food,mood:data.mood,energy:data.energy,clean:data.clean,level:data.level,xp:data.xp,behavior:data.behavior,event:data.event};
   state.level=data.level;state.petName=data.petName||'Eggie';state.plantName='Tuantuan';state.username=data.owner;
   if(data.bio)state.bio=data.bio;if(data.visitMode)state.visitMode=data.visitMode;
   IMAGES.tuantuan=data.tuantuan||IMAGES.tuantuan;IMAGES.egg=data.eggie||IMAGES.egg;
   IMAGES.baybi=data.baybi||IMAGES.baybi;
   if(data.map)IMAGES.map=data.map;
   currentJournal=data.journal||[];
   remoteSaved=data.saves||[];
   const signature=[data.owner,data.level,data.xp,data.food,data.mood,data.energy,data.clean,data.behavior,data.event,data.visitMode,data.journal?.length,data.saves?.join('|')].join('~');
   if(signature!==lastSignature){lastSignature=signature;render(false);}else if(data.map){document.querySelectorAll('.map-img').forEach(el=>{if(el.src!==data.map)el.src=data.map;});}
 };
 window.PlantMateMeOpen=function(opts={}){if(opts.page&&opts.page!=='me'){state.page='me';state.stack=[];go(opts.page)}else{state.page='me';state.stack=[];render(true)}};
 // Permission changes are shared with Social. Keep the V3 six-choice UI; real backend approval is not claimed.
 document.addEventListener('change',event=>{if(event.target&&event.target.name==='visiting'){try{window.parent.PlantMateHub.setVisitMode(event.target.value);}catch(_){}}},true);
})();

</script>
</body></html>
