name: plant

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: plant-backend:latest
    container_name: plant-backend
    restart: unless-stopped
    env_file:
      - /opt/plant/.env
    ports:
      - "8082:8080"
    networks:
      - deploy_backend
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

networks:
  deploy_backend:
    external: true
