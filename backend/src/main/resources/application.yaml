spring:
  config:
    import: optional:file:${PLANT_ENV_FILE:./.env}[.properties]
  application:
    name: plant
  datasource:
    url: ${DB_URL:jdbc:postgresql://8.155.138.61:5432/plant}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:8.155.138.61}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:}
