spring:
  config:
    import: optional:file:${PLANT_ENV_FILE:./.env}[.properties]
  application:
    name: plant
  datasource:
    url: ${DB_URL:jdbc:postgresql://8.155.138.61:5432/plant}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:8.155.138.61}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:DeepSeek-V4.1-Flash}
    memory-turns: ${AI_MEMORY_TURNS:10}
    input-budget-bytes: ${AI_INPUT_BUDGET_BYTES:32000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
    max-concurrent: ${AI_MAX_CONCURRENT:16}
  jwt:
    secret: ${JWT_SECRET:}
