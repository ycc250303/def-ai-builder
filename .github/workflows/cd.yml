name: 发布后端和 Android 安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: plant-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署后端
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: 打包后端
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -ntp -Dmaven.test.skip=true package

      - name: 组装发布目录
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/plant-release"
          mkdir -p "$stage"
          mapfile -t jars < <(find backend/target -maxdepth 1 -type f -name 'plant-*.jar' ! -name '*.original' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "需要恰好一个后端安装包，实际 ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" "$stage/plant.jar"
          cp deploy/backend/Dockerfile.runtime "$stage/Dockerfile.runtime"
          cp deploy/backend/compose.server.yml "$stage/compose.yml"
          cp deploy/backend/dockerignore "$stage/dockerignore"
          echo "stage=$stage" >> "$GITHUB_ENV"

      - name: 发布到服务器
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash .github/scripts/deploy_backend.sh 8.155.138.61 "$stage"

  apk:
    name: 打包 Android 正式安装包
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: 准备 Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: 打包正式安装包
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=http://8.155.138.61:8082

      - name: 确认安装包未开启调试
        run: |
          set -euo pipefail
          apk="app/build/app/outputs/flutter-apk/app-release.apk"
          aapt="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort | tail -1)"
          test -n "$aapt"
          test -f "$apk"
          if "$aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F 'android:debuggable' | grep -q '0xffffffff'; then
            echo "正式安装包带有调试标志" >&2
            exit 1
          fi

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
